<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="pipe" x1="56" y1="196" x2="200" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8f6bff"/>
      <stop offset="0.55" stop-color="#ff4fa3"/>
      <stop offset="1" stop-color="#ffb13d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.22" r="0.95">
      <stop offset="0" stop-color="#2c2050"/>
      <stop offset="1" stop-color="#0d0a17"/>
    </radialGradient>
    <pattern id="checker" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="#1a1528"/>
      <rect width="12" height="12" fill="#2a2340"/>
      <rect x="12" y="12" width="12" height="12" fill="#2a2340"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0.45" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="corner">
      <rect width="256" height="256" fill="url(#fade)"/>
    </mask>
    <clipPath id="badge">
      <rect width="256" height="256" rx="56"/>
    </clipPath>
    <filter id="shine" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>
  <g clip-path="url(#badge)">
    <rect width="256" height="256" fill="url(#glow)"/>
    <rect width="256" height="256" fill="url(#checker)" mask="url(#corner)"/>
  </g>
  <rect x="2" y="2" width="252" height="252" rx="54" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="4"/>
  <polyline points="62,190 62,74 128,146 194,74 194,190" fill="none" stroke="url(#pipe)" stroke-width="26"
            stroke-linecap="round" stroke-linejoin="round" filter="url(#shine)" opacity="0.55"/>
  <polyline points="62,190 62,74 128,146 194,74 194,190" fill="none" stroke="url(#pipe)" stroke-width="22"
            stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#f6f2ff" stroke="#0d0a17" stroke-width="6">
    <circle cx="62" cy="74" r="15"/>
    <circle cx="194" cy="74" r="15"/>
    <circle cx="128" cy="146" r="15"/>
    <circle cx="62" cy="190" r="12"/>
    <circle cx="194" cy="190" r="12"/>
  </g>
</svg>
